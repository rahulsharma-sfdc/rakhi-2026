<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakhi Spin Wheel 🪢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#FFDFA0;
    --bg-mid:#FFF8EA;
    --gold:#E7A33B;
    --gold-light:#F3C877;
    --saffron:#EF7C3C;
    --cream:#FFFBF2;
    --thread-red:#C1272D;
    --leaf:#4F7A52;
    --ink:#5C1A2E;
    --maroon:#7A2340;
    --shadow-deep: rgba(150,80,40,.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(ellipse at top, var(--bg-mid) 0%, var(--bg-deep) 70%),
      linear-gradient(180deg, var(--bg-deep), #FFF3DA);
    color:var(--ink);
    overflow-x:hidden;
    position:relative;
  }
  /* ---------- Tassel border across top ---------- */
  .tassel-row{
    display:flex;
    justify-content:center;
    gap:22px;
    padding-top:14px;
    flex-wrap:wrap;
  }
  .tassel{
    width:6px;height:46px;
    background:linear-gradient(180deg, var(--gold), var(--thread-red));
    border-radius:0 0 6px 6px;
    position:relative;
    animation:sway 3s ease-in-out infinite;
    transform-origin:top center;
  }
  .tassel:nth-child(odd){animation-delay:.4s;}
  .tassel::after{
    content:"";
    position:absolute;bottom:-8px;left:50%;
    transform:translateX(-50%);
    width:14px;height:14px;
    border-radius:50%;
    background:var(--gold-light);
    box-shadow:0 0 8px var(--gold);
  }
  @keyframes sway{
    0%,100%{transform:rotate(-4deg);}
    50%{transform:rotate(4deg);}
  }

  header{
    text-align:center;
    padding:18px 20px 8px;
  }
  h1{
    font-family:'Yatra One',cursive;
    font-size:clamp(2.1rem, 5vw, 3.4rem);
    margin:0;
    color:var(--thread-red);
    text-shadow:0 2px 0 var(--gold-light), 0 8px 20px var(--shadow-deep);
    letter-spacing:1px;
  }
  header p{
    margin:8px 0 0;
    font-size:1rem;
    color:var(--ink);
    opacity:.75;
  }
  .rakhi-icon{
    display:block;
    margin:16px auto 0;
    width:74px;height:74px;
    animation:iconIn .6s ease, iconSway 4s ease-in-out 1s infinite;
    transform-origin:top center;
  }
  @keyframes iconIn{
    from{ transform:scale(.4) rotate(-15deg); opacity:0; }
    to{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes iconSway{
    0%,100%{ transform:rotate(-3deg); }
    50%{ transform:rotate(3deg); }
  }

  main{
    max-width:720px;
    margin:0 auto;
    padding:20px 16px 60px;
  }

  .spinning-for{
    text-align:center;
    font-size:1.3rem;
    font-family:'Yatra One',cursive;
    color:var(--thread-red);
    margin-bottom:26px;
    min-height:1.4em;
  }
  .no-name-note{
    text-align:center;
    opacity:.75;
    font-size:.9rem;
    max-width:420px;
    margin:0 auto 24px;
    line-height:1.5;
  }

  /* ---------- Wheel ---------- */
  .wheel-zone{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  .wheel-wrap{
    position:relative;
    width:min(78vw, 380px);
    height:min(78vw, 380px);
  }
  .rim{
    position:absolute;
    inset:-12px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold) 0 10deg, var(--gold-light) 10deg 20deg);
    box-shadow:0 10px 30px var(--shadow-deep), inset 0 0 0 4px var(--thread-red);
  }
  .wheel-svg-holder{
    position:absolute;
    inset:10px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 0 6px var(--ink), 0 0 0 10px var(--gold);
    background:var(--cream);
  }
  #wheel{
    width:100%;height:100%;
    display:block;
    transform:rotate(0deg);
    transition:transform var(--spin-duration, 4.2s) cubic-bezier(.18,.9,.16,1);
  }
  .hub{
    position:absolute;
    top:50%;left:50%;
    width:15%;height:15%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--saffron) 60%, var(--thread-red) 100%);
    border-radius:50%;
    box-shadow:0 0 0 4px var(--cream), 0 6px 14px var(--shadow-deep);
    z-index:3;
  }
  /* diya pointer at top */
  .pointer{
    position:absolute;
    top:-26px;left:50%;
    transform:translateX(-50%);
    z-index:4;
    width:46px;
    filter:drop-shadow(0 4px 8px var(--shadow-deep));
  }
  .flame{
    width:8px;height:14px;
    margin:0 auto 2px;
    background:radial-gradient(circle at 50% 20%, #FFF3B0, var(--saffron) 60%, transparent 100%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation:flicker 1.1s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{transform:scale(1) rotate(-2deg);}
    50%{transform:scale(1.15,1.3) rotate(3deg);}
  }

  .spin-btn{
    font-family:'Yatra One',cursive;
    font-size:1.4rem;
    padding:12px 46px;
    border:none;
    border-radius:999px;
    color:var(--ink);
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    cursor:pointer;
    box-shadow:0 8px 20px rgba(231,163,59,.4);
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s ease;
  }
  .spin-btn:disabled{opacity:.4;cursor:not-allowed;}
  .spin-btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(231,163,59,.55);}

  /* ---------- Result modal ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,4,12,.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .result-card{
    background:linear-gradient(160deg, var(--cream), #FFEFC9);
    color:var(--ink);
    border-radius:22px;
    padding:34px 30px;
    text-align:center;
    max-width:360px;
    width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
    border:3px solid var(--gold);
    position:relative;
    animation:pop .35s ease;
  }
  @keyframes pop{
    from{transform:scale(.8);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  .result-card h2{
    font-family:'Yatra One',cursive;
    margin:6px 0 4px;
    font-size:1.5rem;
    color:var(--thread-red);
  }
  .result-card .prize{
    font-size:1.5rem;
    font-weight:700;
    color:var(--maroon);
    margin:10px 0 16px;
  }
  .result-card .msg{
    font-size:.9rem;
    opacity:.8;
    margin-bottom:20px;
  }
  .close-btn{
    border:none;
    background:linear-gradient(135deg, var(--saffron), var(--thread-red));
    color:var(--cream);
    padding:10px 30px;
    border-radius:999px;
    font-weight:600;
    cursor:pointer;
  }

  .petal{
    position:fixed;
    top:-20px;
    z-index:60;
    pointer-events:none;
    border-radius:50% 0 50% 0;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(105vh) rotate(360deg); opacity:.2; }
  }

  .sound-toggle{
    position:fixed;
    top:14px;right:14px;
    width:42px;height:42px;
    border-radius:50%;
    border:2px solid var(--gold);
    background:rgba(0,0,0,.25);
    color:var(--cream);
    font-size:1.1rem;
    cursor:pointer;
    z-index:70;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s ease;
  }
  .sound-toggle:hover{transform:scale(1.08);}

  @media (prefers-reduced-motion: reduce){
    .tassel,.flame,.rakhi-icon{animation:none;}
    #wheel{transition:none;}
  }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle" title="Toggle sound" aria-label="Toggle sound">🔊</button>
<div class="tassel-row" id="tasselRow"></div>

<header>
  <h1>Spin the Rakhi Wheel
  <svg class="rakhi-icon" viewBox="0 0 100 100" aria-hidden="true">
    <!-- <path d="M38 10 Q50 -6 62 10" fill="none" stroke="#E7A33B" stroke-width="5" stroke-linecap="round"/> -->
    <g>
      <ellipse cx="50" cy="24" rx="6" ry="13" fill="#EF7C3C"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" fill="#EF7C3C" transform="rotate(45 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" fill="#EF7C3C" transform="rotate(90 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" fill="#EF7C3C" transform="rotate(135 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" fill="#EF7C3C" transform="rotate(180 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" fill="#EF7C3C" transform="rotate(225 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" fill="#EF7C3C" transform="rotate(270 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" fill="#EF7C3C" transform="rotate(315 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="17" fill="#E7A33B" stroke="#C1272D" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="8" fill="#C1272D"/>
    <circle cx="50" cy="50" r="3.2" fill="#F3C877"/>
  </svg>
</h1>
  <!-- <p>Ek chakkar, ek surprise, ek pyaar bhara wada — Happy Raksha Bandhan!</p> -->
</header>

<main>
  <div class="spinning-for" id="spinningFor"></div>
  <div class="no-name-note" id="noNameNote" style="display:none;"></div>

  <div class="wheel-zone">
    <div class="wheel-wrap">
      <div class="rim"></div>
      <div class="wheel-svg-holder">
        <svg id="wheel" viewBox="0 0 400 400"></svg>
      </div>
      <div class="hub"></div>
      <div class="pointer">
        <div class="flame"></div>
        <svg width="46" height="30" viewBox="0 0 46 30">
          <path d="M2 6 Q23 -4 44 6 L38 22 Q23 30 8 22 Z" fill="#E7A33B" stroke="#C1272D" stroke-width="1.5"/>
        </svg>
      </div>
    </div>

    <button class="spin-btn" id="spinBtn" disabled>Spin!</button>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="result-card">
    <h2 id="resultName"></h2>
    <div class="prize" id="resultPrize"></div>
    <h2>🎉🎉🎊🥳🥳</h2>
    <div class="msg">Happy Raksha Bandhan! May this thread carry all my love and promises.</div>
    <button class="close-btn" id="closeResult">Yay!</button>
  </div>
</div>

<script>
(function(){
  const PALETTE = ['#EF7C3C','#7A2340','#4F7A52','#C1272D','#E7A33B','#8E4A9E','#2E6E7E','#B85C38'];

  // ---------------------------------------------------------------
  // EDIT THIS SECTION to set up your prizes and each sister's fixed result.
  // The "id" in riggedPrizeId must match one of the prize ids below.
  // Leave riggedPrizeId as '' for a genuinely random spin.
  // Match names are case-insensitive and ignore extra spaces.
  // ---------------------------------------------------------------
  // How long the wheel spins for, in seconds. Change this one number
  // to make every sister's spin faster or slower.
  const SPIN_DURATION_SECONDS = 4.2;

 const PRIZES = [
    {id:'p1', label:'₹ 2100'},
    {id:'p2', label:'₹ 1100'},
    {id:'p4', label:'My Old T-shirt'},
    {id:'p5', label:'A Rabbit'},
    {id:'p6', label:'A Carrot'},
    {id:'p7', label:'A Rabbit Eating Carrot'},
  ];

  const SISTERS = [
    {name:'Mittali', riggedPrizeId:'p1'},
    {name:'Deepali', riggedPrizeId:'p1'},
    {name:'Kashish', riggedPrizeId:'p2', hiddenPrizeIds:['p1']},
    {name:'Urvashi', riggedPrizeId:'p2', hiddenPrizeIds:['p1']}
    // add more like: {name:'Neha', riggedPrizeId:'p5'},
  ];

  // ---------------------------------------------------------------
  // The page is opened as: yoursite.html?name=Priya
  // Only that one name is shown/spun for — no other names appear.
  // Each sister only ever sees the prizes NOT listed in her own
  // hiddenPrizeIds, and riggedPrizeId must point to a prize she can see.
  // ---------------------------------------------------------------

  let currentRotation = 0;
  let spinning = false;
  let activeSister = null;
  let currentWheelPrizes = PRIZES;

  // ---------------------------------------------------------------
  // Sound: everything below is generated live with the Web Audio API
  // (no audio files needed), so it works offline once hosted.
  // ---------------------------------------------------------------
  let audioCtx = null;
  let muted = false;
  function getCtx(){
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    return audioCtx;
  }
  function playTick(){
    if(muted) return;
    const ctx = getCtx();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(680 + Math.random()*60, t);
    gain.gain.setValueAtTime(0.16, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.08);
  }
  function scheduleSpinTicks(deltaDeg, durationMs, prizeCount){
    const n = prizeCount;
    if(n === 0) return;
    const sliceAngle = 360/n;
    const totalSegments = Math.max(1, Math.round(deltaDeg/sliceAngle));
    for(let k=1;k<=totalSegments;k++){
      const frac = k/totalSegments;
      const tickTime = durationMs * (1 - Math.pow(1-frac, 1/3)); // matches ease-out deceleration
      setTimeout(playTick, tickTime);
    }
  }
  function playRevealFanfare(){
    if(muted) return;
    const ctx = getCtx();
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((freq, i)=>{
      const t = ctx.currentTime + i*0.15;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.7);

      const shimmer = ctx.createOscillator();
      const shimmerGain = ctx.createGain();
      shimmer.type = 'sine';
      shimmer.frequency.setValueAtTime(freq*2, t);
      shimmerGain.gain.setValueAtTime(0.0001, t);
      shimmerGain.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
      shimmerGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      shimmer.connect(shimmerGain).connect(ctx.destination);
      shimmer.start(t);
      shimmer.stop(t + 0.45);
    });
  }
  document.getElementById('soundToggle').onclick = ()=>{
    muted = !muted;
    document.getElementById('soundToggle').textContent = muted ? '🔇' : '🔊';
  };

  const wheelEl = document.getElementById('wheel');
  const spinBtn = document.getElementById('spinBtn');
  const spinningForEl = document.getElementById('spinningFor');
  const noNameNote = document.getElementById('noNameNote');
  const overlay = document.getElementById('overlay');
  const resultName = document.getElementById('resultName');
  const resultPrize = document.getElementById('resultPrize');

  function colorFor(index){ return PALETTE[index % PALETTE.length]; }

  function polar(cx,cy,r,angleDeg){
    const rad = angleDeg * Math.PI/180;
    return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
  }

  function renderWheel(prizesList){
    const n = prizesList.length;
    wheelEl.innerHTML = '';
    if(n === 0) return;
    const cx=200, cy=200, r=190;
    const slice = 360/n;
    const ns = 'http://www.w3.org/2000/svg';
    prizesList.forEach((prize, i)=>{
      const start = i*slice, end = (i+1)*slice;
      const p1 = polar(cx,cy,r,start);
      const p2 = polar(cx,cy,r,end);
      const largeArc = slice>180?1:0;
      const path = document.createElementNS(ns,'path');
      path.setAttribute('d', `M ${cx} ${cy} L ${p1.x} ${p1.y} A ${r} ${r} 0 ${largeArc} 1 ${p2.x} ${p2.y} Z`);
      path.setAttribute('fill', colorFor(i));
      path.setAttribute('stroke', '#FFF6E4');
      path.setAttribute('stroke-width', '2');
      wheelEl.appendChild(path);

      const mid = start + slice/2;
      const g = document.createElementNS(ns,'g');
      g.setAttribute('transform', `rotate(${mid} ${cx} ${cy})`);

      const icon = document.createElementNS(ns, 'text');
      icon.setAttribute('x', cx);
      icon.setAttribute('y', cy - r * 0.72);
      icon.setAttribute('text-anchor', 'middle');
      icon.setAttribute('font-size', n > 8 ? '18' : '22');
      icon.setAttribute('font-family', 'Arial, sans-serif');
      //icon.textContent = prize.icon || (prize.label.includes('Rabit Eating Carrot') ? 🥕🐇 : ( prize.label.includes('A Carrot') ?🥕: ( prize.label.includes('A Rabbit') ? 🐇 : (
      //prize.label.includes('T-Shirt') ? 👕 : 💸))));

      icon.textContent = prize.icon || (
        prize.label.includes('Rabbit Eating Carrot') ? '🥕🐇' :
        prize.label.includes('A Carrot') ? '🥕' :
        prize.label.includes('A Rabbit') ? '🐇' :
        prize.label.includes('T-shirt') ? '👕' :
        '💸'
      );

      g.appendChild(icon);


      // --------------------
      // PRIZE TEXT
      // --------------------
      const text = document.createElementNS(ns, 'text');
      text.setAttribute('x', cx);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-size', n > 8 ? '12' : '14');
      text.setAttribute('font-family', 'Poppins, sans-serif');
      text.setAttribute('font-weight', '600');
      text.setAttribute('fill', '#FFF6E4');

      // Wrap text by words
      const words = prize.label.split(' ');
      const lines = [];
      let currentLine = '';

      const maxChars = n > 8 ? 12 : 16;

      words.forEach(word => {
        const testLine = currentLine
          ? currentLine + ' ' + word
          : word;

        if (testLine.length > maxChars && currentLine) {
          lines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = testLine;
        }
      });

      if (currentLine) {
        lines.push(currentLine);
      }

      // Maximum 3 lines
      const displayLines = lines.slice(0, 3);

      displayLines.forEach((line, index) => {
        const tspan = document.createElementNS(ns, 'tspan');

        tspan.setAttribute('x', cx);

        // Position lines vertically
        tspan.setAttribute(
          'dy',
          index === 0 ? '0' : '16'
        );

        tspan.textContent = line;

        text.appendChild(tspan);
      });

      // Position the text below the icon
      text.setAttribute(
        'y',
        cy - r * 0.58
      );
      g.appendChild(text);
      wheelEl.appendChild(g);
    });
  }

  function normalize(str){
    return str.trim().toLowerCase().replace(/\s+/g,' ');
  }

  function getVisiblePrizes(sister){
    if(!sister || !sister.hiddenPrizeIds || sister.hiddenPrizeIds.length === 0) return PRIZES;
    return PRIZES.filter(p => !sister.hiddenPrizeIds.includes(p.id));
  }

  function resolveSister(){
    const params = new URLSearchParams(window.location.search);
    const nameParam = params.get('name');
    if(!nameParam){
      noNameNote.style.display = 'block';
      noNameNote.textContent = 'No name found in the link. Ask your brother for your personal spin link!';
      spinningForEl.textContent = '';
      return null;
    }
    const match = SISTERS.find(s => normalize(s.name) === normalize(nameParam));
    if(!match){
      noNameNote.style.display = 'block';
      noNameNote.textContent = `Couldn't find "${nameParam}" — double check the link.`;
      spinningForEl.textContent = '';
      return null;
    }
    noNameNote.style.display = 'none';
    spinningForEl.textContent = `Spinning for ${match.name}`;
    return match;
  }

  function spawnConfetti(){
    const colors = ['#EF7C3C','#E7A33B','#C1272D','#F3C877','#4F7A52'];
    for(let i=0;i<40;i++){
      const petal = document.createElement('div');
      petal.className = 'petal';
      const size = 6 + Math.random()*8;
      petal.style.width = size+'px';
      petal.style.height = size+'px';
      petal.style.left = Math.random()*100+'vw';
      petal.style.background = colors[Math.floor(Math.random()*colors.length)];
      const duration = 2.2 + Math.random()*1.8;
      petal.style.animationDuration = duration+'s';
      document.body.appendChild(petal);
      setTimeout(()=>petal.remove(), duration*1000+200);
    }
  }

  spinBtn.onclick = ()=>{
    if(spinning || !activeSister || currentWheelPrizes.length===0) return;

    let targetIndex;
    if(activeSister.riggedPrizeId){
      const idx = currentWheelPrizes.findIndex(p=>p.id===activeSister.riggedPrizeId);
      targetIndex = idx>=0 ? idx : Math.floor(Math.random()*currentWheelPrizes.length);
    } else {
      targetIndex = Math.floor(Math.random()*currentWheelPrizes.length);
    }

    const n = currentWheelPrizes.length;
    const slice = 360/n;
    const sliceCenter = targetIndex*slice + slice/2;
    const jitter = (Math.random()-0.5) * (slice*0.5);
    const targetAngle = ((sliceCenter + jitter) % 360 + 360) % 360;

    const currentMod = ((currentRotation % 360) + 360) % 360;
    let delta = (360 - targetAngle) - currentMod;
    delta = ((delta % 360) + 360) % 360;
    const extraSpins = 6*360;
    currentRotation += extraSpins + delta;

    spinning = true;
    spinBtn.disabled = true;
    wheelEl.style.transform = `rotate(${currentRotation}deg)`;

    const spinDurationMs = SPIN_DURATION_SECONDS * 1000;
    getCtx().resume();
    scheduleSpinTicks(extraSpins + delta, spinDurationMs, currentWheelPrizes.length);

    setTimeout(()=>{
      spinning = false;
      spinBtn.disabled = false;
      const prize = currentWheelPrizes[targetIndex];
      resultName.textContent = activeSister.name + ', You deserved it! ❤️';
      resultPrize.textContent = prize.label;
      overlay.classList.add('show');
      spawnConfetti();
      playRevealFanfare();
    }, spinDurationMs + 100);
  };

  document.getElementById('closeResult').onclick = ()=>{
    overlay.classList.remove('show');
  };

  function buildTassels(){
    const row = document.getElementById('tasselRow');
    for(let i=0;i<11;i++){
      const t = document.createElement('div');
      t.className = 'tassel';
      t.style.animationDelay = (i*0.15)+'s';
      row.appendChild(t);
    }
  }

  document.documentElement.style.setProperty('--spin-duration', SPIN_DURATION_SECONDS + 's');
  buildTassels();
  activeSister = resolveSister();
  currentWheelPrizes = activeSister ? getVisiblePrizes(activeSister) : PRIZES;
  renderWheel(currentWheelPrizes);
  spinBtn.disabled = !activeSister;
})();
</script>
</body>
</html>
